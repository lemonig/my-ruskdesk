# RustDesk Web Client WSS 反向代理 —— ruskesk.greandata1.com
# 位置:/www/server/panel/vhost/nginx/ruskesk.greandata1.com.conf(宝塔 vhost 目录,自动 include)
#
# 用途:rustdesk.com/web 公共 Web Client 经本站点 WSS 连接自建 hbbs/hbbr:
#   /ws/id    -> 127.0.0.1:21118 (hbbs WebSocket)
#   /ws/relay -> 127.0.0.1:21119 (hbbr WebSocket)
#
# 证书:*.greandata1.com 通配符证书副本(WoTrus DV,有效期至 2027-02-04),
#   副本目录 /www/server/panel/vhost/cert/ruskesk.greandata1.com/
#   ⚠ 通配符证书到期前需更新副本(源:/www/server/panel/vhost/cert/pollution.greandata1.com/)
#
# 安全:hbbs/hbbr 的 21118/21119 未对公网开放(firewalld),公网仅走本站点 443;
#   $connection_upgrade map 定义于 0.websocket.conf(宝塔自带)。

server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ruskesk.greandata1.com;

    ssl_certificate    /www/server/panel/vhost/cert/ruskesk.greandata1.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/ruskesk.greandata1.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rustdesk_ssl:10m;
    ssl_session_timeout 10m;

    # ---------- WebSocket: ID 服务器(hbbs 21118) ----------
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- WebSocket: 中继(hbbr 21119) ----------
    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;   # 屏幕视频流不缓冲,降低延迟
    }

    # ---------- 根路径:占位说明 ----------
    location / {
        default_type text/plain;
        return 200 'RustDesk WSS endpoint (hbbs/hbbr behind Nginx).\nWeb Client: https://rustdesk.com/web  ->  ID server: ruskesk.greandata1.com\n';
    }
}
