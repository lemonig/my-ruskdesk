# RustDesk Web Client 反向代理模板（HTTPS + WSS）
# 依据：RustDesk Server Pro 官方 FAQ「部署 Web Client」步骤（同样适用于 OSS hbbs/hbbr，
#   因 OSS hbbs/hbbr 自带 WebSocket 监听 21118/21119）：
#   https://rustdesk.com/docs/en/self-host/rustdesk-server-pro/faq/
#   - /ws/id   -> 127.0.0.1:21118（hbbs WebSocket）
#   - /ws/relay-> 127.0.0.1:21119（hbbr WebSocket）
#   - 必须带 Upgrade/Connection 头，proxy_read_timeout 120s
#   - 使用公共 Web Client https://rustdesk.com/web 时需配置 CORS（见下方注释块）
#
# 使用前替换 <YOUR_DOMAIN> 与证书路径。该文件为模板，上线前需实测。

server {
    listen 443 ssl;
    http2 on;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/nginx/certs/<YOUR_DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/certs/<YOUR_DOMAIN>.key;

    # ---------- WebSocket: ID 服务器（hbbs 21118） ----------
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ---------- WebSocket: 中继（hbbr 21119） ----------
    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ---------- （可选）公共 Web Client 的 CORS 配置 ----------
    # 仅当使用公共 Web Client https://rustdesk.com/web 连接本服务器时需要；
    # 使用自托管 Web Client（Pro）时可删除。
    # 官方 FAQ 在 location / 中对来自 rustdesk.com 的请求返回 CORS 头，
    # 并对 OPTIONS 预检直接返回 204。如需启用，取消下段注释并按需调整。
    #
    # set $cors "";
    # if ($http_origin = "https://rustdesk.com") {
    #     set $cors "1";
    # }
    # location / {
    #     if ($cors = "1") {
    #         add_header Access-Control-Allow-Origin $http_origin always;
    #         add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    #         add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
    #     }
    #     if ($request_method = OPTIONS) {
    #         return 204;
    #     }
    #     proxy_pass http://127.0.0.1:21114;   # Pro: API/控制台端口；OSS 无此端口，按实际服务调整
    # }

    # ---------- （Pro 才有）Web Console / 自托管 Web Client ----------
    # Pro 安装包自带 Web Console（21114）与自托管 Web Client（https://<YOUR_DOMAIN>/web），
    # 由 Nginx 反代 21114 暴露；OSS 版不存在这两个组件。
    # location /web {
    #     proxy_pass http://127.0.0.1:21114;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

# HTTP 跳转 HTTPS
server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}
